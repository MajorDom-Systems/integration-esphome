name: QA & Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: github.repository != 'MajorDom-Systems/integration-template'
    uses: ParkerIndustries/workflows/.github/workflows/test.yml@v1
    with:
      setup-script: |
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
    # если нужны дополнительные параметры, добавьте их

  template-selfcheck:
    if: github.repository == 'MajorDom-Systems/integration-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          poetry install
      - name: Lint & type-check
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run ty check
      - name: Tests (excluding the prefilled, expected-to-fail controller suite)
        run: poetry run pytest --ignore=tests/test_controller.py