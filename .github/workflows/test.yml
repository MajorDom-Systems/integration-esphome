name: QA & Tests

on:
  push:
    # Long-lived branches — keep whichever your repo uses (main or master) and develop.
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  # Real integrations created from this template (any repo other than the template itself)
  # run the full shared QA suite, including tests/test_controller.py — which stays red until
  # the controller is implemented.
  test:
    if: github.repository != 'MajorDom-Systems/integration-template'
    uses: ParkerIndustries/workflows/.github/workflows/test.yml@v1
    # Defaults to the team matrix ["3.12", "3.13"]. Uncomment to customize:
    # with:
    #   python-versions: '["3.12", "3.13", "3.14"]'
    #   # Runs after `poetry install`, before checks (system deps, Cython build_ext, ...):
    #   setup-script: |
    #     sudo apt-get update && sudo apt-get install -y espeak-ng
    #   # Teardown, always runs after checks:
    #   post-run-script: docker compose down

  # ─────────────────────────────────────────────────────────────────────────────
  # TEMPLATE-ONLY — delete this whole job AND the `if:` line on `test` above when you
  # scaffold a real integration.
  #
  # tests/test_controller.py is prefilled to FAIL until the controller is implemented (no
  # skip markers in the code or pytest config — deliberate, so a real integration's CI is
  # red until it works). On the template repo itself we run everything *except* that file so
  # the template stays green. This exclusion lives only here, only for the template's repo.
  template-selfcheck:
    if: github.repository == 'MajorDom-Systems/integration-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # No `cache: poetry` — the template gitignores poetry.lock, so there's nothing to key on.
      - name: Install dependencies
        run: poetry install
      - name: Lint & type-check (full tree, including the skeleton tests)
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run ty check
      - name: Tests (excluding the prefilled, expected-to-fail controller suite)
        run: poetry run pytest --ignore=tests/test_controller.py
