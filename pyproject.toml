[project]
name = "majordom-esphome"
version = "0.1.2"
description = "ESPHome integration for MajorDom — bridges ESPHome devices into the MajorDom language."
authors = [
    { name = "Mark Parker", email = "mark@parker-programs.com" }
]
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
keywords = [
    "majordom",
    "smart-home",
    "home-automation",
    "iot",
    "esphome",
    "integration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "majordom-integration-sdk (>=0.1.6,<1.0)",
    "aioesphomeapi >=46.6.0",
    "pydantic (>=2.13.5,<3.0.0)",
]

[tool.poetry.dependencies]
python = "^3.12"
noiseprotocol = { version = ">=0.3.1,<1.0", python = ">=3.12" }

[project.urls]
Homepage = "https://majordom.io"
Documentation = "https://docs.majordom.io/device-integration"
Repository = "https://github.com/MajorDom-Systems/integration-esphome"

[dependency-groups]
dev = [
    "poethepoet (>=0.36.0,<1.0.0)",
    "ty",
    "ruff",
    "pip-audit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-repeat",
    "pytest-benchmark",
    "pytest-profiling",
    "pytest-resource-usage",
    "coverage",
    "pympler",
    "psutil",
    "faker",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "majordom_esphome" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = ["once"]
timeout = 30
# the catalogue sweep builds a node per entity kind: opt in with `-m catalogue` (the monthly canary does)
addopts = '-m "not catalogue"'

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E402"]

[tool.poe.tasks.install]
shell = """
poetry install
echo '#!/bin/sh\\npoetry run poe check' > .git/hooks/pre-commit
chmod +x .git/hooks/pre-commit
echo "Pre-commit hook installed."
"""

[tool.poe.tasks.check]
shell = """
code=0

echo "\\nRunning ruff lint:"
poetry run ruff check --fix || code=1

echo "\\nRunning ruff format:"
poetry run ruff format || code=1

echo "\\nRunning ty:"
poetry run ty check || code=1

echo "\\nRunning pytest:"
poetry run pytest -v --cov=majordom_esphome --cov-report=xml || code=1

echo "\\nRunning poetry build:"
poetry build || code=1

echo "\\nRunning poetry check:"
poetry check || code=1

${ci:+git diff --exit-code} || code=1

exit $code
"""
args = [{ name = "ci", type = "boolean" }]