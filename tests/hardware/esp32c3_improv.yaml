# Hardware DUT for the Improv BLE -> Wi-Fi -> zero-PSK key pairing test (tests/hardware/test_improv_hardware.py).
# Ships with no credentials at all, like a "made for MajorDom" DIY node: no Wi-Fi network, no API key.
# Flash once (USB):  esphome run tests/hardware/esp32c3_improv.yaml --device /dev/serial/by-id/<the C3>
# Press the BOOT button to authorize setup when built with `-s authorizer boot_button`.
substitutions:
  authorizer: none  # or boot_button: the test then asks for (and waits for) a button press

esphome:
  name: md-hw-improv  # the test finds the node by this name, over BLE and then over mDNS
  friendly_name: Cage C3  # with its MAC, what the cage guard (duts.py) knows the DUT by

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

wifi:  # no networks: the Hub sets them over Improv

esp32_improv:  # `improv_ble` from ESPHome 2026.11 (this name stays an alias until 2027.4.0)
  authorizer: ${authorizer}

api:
  encryption: {}  # no key: the Hub sets one over the zero PSK at pairing

binary_sensor:
  - platform: gpio
    id: boot_button
    pin:
      number: GPIO9
      inverted: true
      mode: INPUT_PULLUP

switch:
  - platform: template
    name: "Test Switch"
    optimistic: true

sensor:
  - platform: wifi_signal  # the cage guard acts on the node only when it is heard from inside the closed cage
    name: "Wi-Fi Signal"
    update_interval: 10s

button:
  - platform: factory_reset  # forgets Wi-Fi and the API key, so every run starts from an unprovisioned node
    name: "Factory Reset"
